<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glossaire Équestre</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brown:      #6b4226;
      --brown-light:#a0673a;
      --tan:        #d4a96a;
      --cream:      #fdf6ec;
      --green:      #4a7c59;
      --green-light:#6aa87a;
      --text:       #2c1a0e;
      --muted:      #8a7060;
      --border:     #e0cdb8;
      --white:      #ffffff;
      --sidebar-w:  260px;
    }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--brown);
      color: var(--white);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,.3);
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: normal;
      letter-spacing: .03em;
      flex: 1;
    }
    header h1 span {
      opacity: .65;
      font-size: .95rem;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 6px;
      padding: .35rem .7rem;
      gap: .4rem;
    }
    .search-box input {
      background: none;
      border: none;
      outline: none;
      color: var(--white);
      font-size: .9rem;
      width: 180px;
    }
    .search-box input::placeholder { color: rgba(255,255,255,.55); }
    .search-box svg { opacity: .65; flex-shrink: 0; }

    /* ── Layout ── */
    .layout {
      display: flex;
      min-height: calc(100vh - 58px);
    }

    /* ── Sidebar ── */
    aside {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--white);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      position: sticky;
      top: 58px;
      height: calc(100vh - 58px);
    }
    .sidebar-title {
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
      padding: 1rem 1rem .4rem;
    }
    nav ul { list-style: none; padding: 0 .5rem .5rem; }
    nav ul li {
      margin: 1px 0;
    }
    nav ul li button {
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      cursor: pointer;
      padding: .55rem .75rem;
      border-radius: 6px;
      font-family: inherit;
      font-size: .88rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: .5rem;
      transition: background .15s, color .15s;
    }
    nav ul li button:hover { background: var(--cream); }
    nav ul li button.active {
      background: var(--brown);
      color: var(--white);
    }
    nav ul li button .count {
      margin-left: auto;
      font-size: .72rem;
      opacity: .6;
      background: rgba(0,0,0,.08);
      padding: .1rem .45rem;
      border-radius: 10px;
    }
    nav ul li button.active .count { background: rgba(255,255,255,.2); opacity: 1; }
    .cat-icon { font-size: 1rem; flex-shrink: 0; }

    /* ── Main content ── */
    main {
      flex: 1;
      padding: 2rem 2.5rem;
      overflow-y: auto;
    }

    /* Search results banner */
    .search-banner {
      background: var(--tan);
      color: var(--brown);
      padding: .6rem 1rem;
      border-radius: 8px;
      font-size: .9rem;
      margin-bottom: 1.5rem;
    }

    /* Category section */
    .category-section { margin-bottom: 3rem; }
    .category-header {
      display: flex;
      align-items: baseline;
      gap: .75rem;
      margin-bottom: 1.25rem;
      padding-bottom: .6rem;
      border-bottom: 2px solid var(--tan);
    }
    .category-header h2 {
      font-size: 1.35rem;
      color: var(--brown);
      font-weight: normal;
    }
    .category-header .cat-count {
      font-size: .8rem;
      color: var(--muted);
    }

    .subcategory { margin-bottom: 1.5rem; }
    .subcategory-intro {
      font-size: .85rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: .75rem;
      font-style: italic;
    }
    .subcategory-title {
      font-size: .95rem;
      color: var(--green);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: .75rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .subcategory-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--green-light);
      opacity: .4;
    }

    /* Term cards grid */
    .terms-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: .75rem;
    }

    .term-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .9rem 1rem;
      transition: box-shadow .15s, border-color .15s;
    }
    .term-card:hover {
      box-shadow: 0 3px 12px rgba(107,66,38,.1);
      border-color: var(--tan);
    }
    .term-card h3 {
      font-size: .95rem;
      color: var(--brown);
      margin-bottom: .4rem;
      font-style: italic;
    }
    .term-card p {
      font-size: .85rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .term-card ul {
      font-size: .85rem;
      color: var(--muted);
      line-height: 1.6;
      padding-left: 1.1rem;
    }

    .cat-illustration {
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      background: var(--white);
      border: 1px solid var(--border);
      padding: .5rem;
    }

    /* Search highlight */
    mark {
      background: var(--tan);
      color: var(--brown);
      border-radius: 2px;
      padding: 0 1px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
    .empty-state p { font-size: 1rem; }

    /* Responsive */
    @media (max-width: 680px) {
      aside {
        display: none;
      }
      main { padding: 1.25rem 1rem; }
      .search-box input { width: 120px; }
      header h1 span { display: none; }
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>🐴 Glossaire Équestre <span>— Centre équestre</span></h1>
    <div class="search-box">
      <svg width="14" height="14" fill="white" viewBox="0 0 20 20">
        <path d="M12.9 14.32a8 8 0 111.41-1.41l5.35 5.33-1.42
          1.42-5.33-5.34zM8 14A6 6 0 108 2a6 6 0 000 12z"/>
      </svg>
      <input
        v-model="search"
        type="search"
        placeholder="Rechercher un terme…"
        @input="onSearch"
      />
    </div>
  </header>

  <div class="layout">
    <aside>
      <div class="sidebar-title">Catégories</div>
      <nav>
        <ul>
          <li v-for="cat in categories" :key="cat.id">
            <button
              :class="{ active: activeCat === cat.id && !search }"
              @click="selectCat(cat.id)"
            >
              <span class="cat-icon">{{ cat.icon }}</span>
              {{ cat.label }}
              <span class="count">{{ cat.totalTerms }}</span>
            </button>
          </li>
        </ul>
      </nav>
    </aside>

    <main>
      <!-- Search results -->
      <template v-if="search">
        <div class="search-banner" v-if="searchResults.length">
          {{ searchResults.length }} résultat{{ searchResults.length > 1
            ? 's' : '' }} pour « {{ search }} »
        </div>
        <div v-if="!searchResults.length" class="empty-state">
          <div class="icon">🔍</div>
          <p>Aucun terme trouvé pour « {{ search }} »</p>
        </div>
        <div class="terms-grid" v-else>
          <div
            class="term-card"
            v-for="r in searchResults"
            :key="r.cat + r.term"
          >
            <h3 v-html="highlight(r.term)"></h3>
            <p v-if="!r.items" v-html="highlight(r.def)"></p>
            <ul v-else>
              <li v-for="item in r.items" :key="item">{{ item }}</li>
            </ul>
          </div>
        </div>
      </template>

      <!-- Normal browsing -->
      <template v-else>
        <div
          class="category-section"
          v-for="cat in visibleCategories"
          :key="cat.id"
          :id="cat.id"
        >
          <div class="category-header">
            <h2>{{ cat.icon }} {{ cat.label }}</h2>
            <span class="cat-count">
              {{ cat.totalTerms }} terme{{ cat.totalTerms > 1 ? 's' : '' }}
            </span>
          </div>
          <img
            v-if="cat.image"
            :src="cat.image"
            :alt="cat.label"
            class="cat-illustration"
          />

          <!-- Category with subcategories -->
          <template v-if="cat.subcategories">
            <div
              class="subcategory"
              v-for="sub in cat.subcategories"
              :key="sub.label"
            >
              <div class="subcategory-title">{{ sub.label }}</div>
              <p
                class="subcategory-intro"
                v-if="sub.intro"
              >{{ sub.intro }}</p>
              <div class="terms-grid">
                <div
                  class="term-card"
                  v-for="t in sub.terms"
                  :key="t.term"
                >
                  <h3>{{ t.term }}</h3>
                  <p v-if="!t.items">{{ t.def }}</p>
                  <ul v-else>
                    <li v-for="item in t.items" :key="item">{{ item }}</li>
                  </ul>
                </div>
              </div>
            </div>
          </template>

          <!-- Flat category -->
          <div class="terms-grid" v-else>
            <div
              class="term-card"
              v-for="t in cat.terms"
              :key="t.term"
            >
              <h3>{{ t.term }}</h3>
              <p v-if="!t.items">{{ t.def }}</p>
              <ul v-else>
                <li v-for="item in t.items" :key="item">{{ item }}</li>
              </ul>
            </div>
          </div>
        </div>
      </template>
    </main>
  </div>
</div>

function countTerms(cat) {
  if (cat.subcategories) {
    return cat.subcategories.reduce((n, s) => n + s.terms.length, 0)
  }
  return cat.terms.length
}

const categories = ALL_CATS.map(c => ({ ...c, totalTerms: countTerms(c) }))

function flatTerms(cat) {
  if (cat.subcategories) {
    return cat.subcategories.flatMap(s =>
      s.terms.map(t => ({ ...t, cat: cat.id }))
    )
  }
  return cat.terms.map(t => ({ ...t, cat: cat.id }))
}

createApp({
  setup() {
    const search   = ref('')
    const activeCat = ref('lieux')

    const visibleCategories = computed(() => {
      if (!activeCat.value) return categories
      return categories.filter(c => c.id === activeCat.value)
    })

    const searchResults = computed(() => {
      const q = search.value.toLowerCase().trim()
      if (!q) return []
      return categories.flatMap(cat =>
        flatTerms(cat).filter(t =>
          t.term.toLowerCase().includes(q) ||
          (t.def  && t.def.toLowerCase().includes(q))
        )
      )
    })

    function selectCat(id) {
      search.value = ''
      activeCat.value = id
      const el = document.getElementById(id)
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' })
    }

    function onSearch() {
      if (search.value) activeCat.value = ''
    }

    function highlight(text) {
      if (!search.value) return text
      const q = search.value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
      return text.replace(new RegExp(`(${q})`, 'gi'), '<mark>$1</mark>')
    }

    return {
      search, activeCat,
      categories, visibleCategories, searchResults,
      selectCat, onSearch, highlight,
    }
  },
}).mount('#app')
</script>
