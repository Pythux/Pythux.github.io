<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cheval</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 500;
      color: #888;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
      width: 100%;
      max-width: 560px;
    }

    a.card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .6rem;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 2rem 1.5rem;
      text-decoration: none;
      color: #222;
      transition: box-shadow .15s, border-color .15s, transform .15s;
    }

    a.card:hover {
      box-shadow: 0 6px 20px rgba(0, 0, 0, .1);
      border-color: #bbb;
      transform: translateY(-2px);
    }

    .card-icon {
      font-size: 2.5rem;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
    }

    .card-desc {
      font-size: .8rem;
      color: #888;
      text-align: center;
    }
  </style>
</head>

<body>
  <h1>Le cheval n'a plus de secret pour moi</h1>
  <div class="grid">
    <a class="card" href="Glossaire Équestre/">
      <span class="card-icon">🐴</span>
      <span class="card-title">Glossaire Équestre</span>
      <span class="card-desc">Termes et vocabulaire du centre équestre</span>
    </a>
    <a class="card" href="Ma-Petite-Licorne/">
      <span class="card-icon">🦄</span>
      <span class="card-title">Ma Petite Licorne</span>
      <span class="card-desc">Gestion du centre équestre</span>
    </a>
  </div>
</body>

</html>
